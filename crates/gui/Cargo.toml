[package]
name = "blt_unlock_gui"
version.workspace = true
edition.workspace = true

[target.'cfg(windows)'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.38.0"
raw-window-handle = "0.6.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tray-icon = { version = "0.27.0", default-features = false }
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
xiaomi-s200 = { path = "../scale" }

[build-dependencies]
winresource = "0.1.34"

[lints]
workspace = true
