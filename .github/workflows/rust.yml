name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Checked Windows build
      if: runner.os == 'Windows'
      shell: cmd
      run: call build.cmd
    - name: Clippy on Linux
      if: runner.os == 'Linux'
      run: cargo clippy --locked --workspace --all-targets
    - name: Run workspace tests
      run: cargo test --locked --workspace
